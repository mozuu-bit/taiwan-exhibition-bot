name: 每週展覽通報

on:
  schedule:
    - cron: '0 2 * * 1'  # 每週一早上10:00 (台灣時間)
  workflow_dispatch:  # 允許手動執行

jobs:
  send-exhibitions:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install requests
    
    - name: Run bot
      run: |
        python bot.py
